<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dendro E2E Test Harness</title>
    <style>
        @font-face {
            font-family: 'Space Grotesk';
            src: url('/dist/fonts/space-grotesk-500.woff2') format('woff2');
            font-weight: 500;
            font-display: block;
        }
        @font-face {
            font-family: 'Space Grotesk';
            src: url('/dist/fonts/space-grotesk-700.woff2') format('woff2');
            font-weight: 700;
            font-display: block;
        }
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('/dist/fonts/jetbrains-mono-400.woff2') format('woff2');
            font-weight: 400;
            font-display: block;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: 'Space Grotesk', Inter, 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
            background: #0A0E17;
        }
        #root { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        // Mock VS Code API — captures messages for test assertions
        window._capturedMessages = [];
        var vscode = {
            postMessage: function(msg) { window._capturedMessages.push(msg); }
        };
        window.dendroSessionId = 'e2e-test-session';
        window.dendroInitialTheme = 'dark';
        window.onerror = function(msg, url, line) {
            console.error('Dendro E2E harness error:', msg, 'at line', line);
        };
    </script>
    <script src="/dist/webview.js"></script>
</body>
</html>
